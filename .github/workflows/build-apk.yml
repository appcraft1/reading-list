name: Build Android APK Otomatis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Bundle Web Assets
        run: node build.js

      - name: 🔄 Init & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔑 Permission Gradlew
        run: chmod +x android/gradlew

      - name: ⚙️ Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: Reading-List-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
