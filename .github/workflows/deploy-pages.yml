name: Deploy ke GitHub Pages (Live OTA Update)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Bundle Web Assets
        run: node build.js

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: 🚀 Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
