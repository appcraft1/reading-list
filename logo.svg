<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Scan Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#accentGrad)" opacity="0.12" filter="url(#glowFilter)" />

  <!-- Stylized Open Book & Camera Aperture / Scan Frame -->
  <g transform="translate(256, 256)">
    <!-- Book Spine Glow -->
    <path d="M -120, -50 C -60, -90 -10, -50 0, -40 C 10, -50 60, -90 120, -50 L 120, 80 C 60, 40 10, 80 0, 90 C -10, 80 -60, 40 -120, 80 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Open Pages (Stylized Cards) -->
    <!-- Left Page / Cover Card -->
    <rect x="-105" y="-30" width="90" height="110" rx="14" fill="#181e2b" stroke="rgba(255,255,255,0.15)" stroke-width="4" transform="rotate(-6)" />
    <!-- Cover Thumbnail Mockup on Left Page -->
    <rect x="-95" y="-18" width="70" height="50" rx="8" fill="url(#accentGrad)" opacity="0.85" transform="rotate(-6)" />
    <line x1="-93" y1="46" x2="-45" y2="40" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
    <line x1="-91" y1="60" x2="-55" y2="55" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Right Page / Details Card -->
    <rect x="15" y="-30" width="90" height="110" rx="14" fill="#181e2b" stroke="rgba(255,255,255,0.15)" stroke-width="4" transform="rotate(6)" />
    <rect x="27" y="-16" width="66" height="14" rx="4" fill="#38bdf8" opacity="0.9" transform="rotate(6)" />
    <line x1="28" y1="14" x2="80" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="30" x2="74" y2="35" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="46" x2="68" y2="50" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <!-- Center Scanner / Optical Focus Frame -->
    <!-- Top-Left Corner -->
    <path d="M -130, -100 L -100, -100 M -130, -100 L -130, -70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Top-Right Corner -->
    <path d="M 130, -100 L 100, -100 M 130, -100 L 130, -70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <!-- Bottom-Left Corner -->
    <path d="M -130, 110 L -100, 110 M -130, 110 L -130, 80" stroke="#c084fc" stroke-width="8" stroke-linecap="round" />
    <!-- Bottom-Right Corner -->
    <path d="M 130, 110 L 100, 110 M 130, 110 L 130, 80" stroke="#c084fc" stroke-width="8" stroke-linecap="round" />

    <!-- Center Laser / Sparkle Vision Node -->
    <circle cx="0" cy="-40" r="12" fill="#ffffff" filter="url(#glowFilter)" />
    <circle cx="0" cy="-40" r="6" fill="#38bdf8" />
  </g>
</svg>
