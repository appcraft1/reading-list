<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cheerful Bright Gradient Base -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Warm Golden Bookmark Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Page White Crisp Shading -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="15%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glow & Soft Shadow Filters -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.32" />
    </filter>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Vibrant Cheerful Gradient -->
  <rect width="512" height="512" rx="136" fill="url(#logoBgGrad)" />
  <!-- Inner Rim Highlight -->
  <rect width="504" height="504" x="4" y="4" rx="132" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="6" />

  <!-- Background Soft Sunny Glow -->
  <circle cx="256" cy="230" r="150" fill="#ffffff" opacity="0.12" />

  <!-- Main Hero Graphic: Open Book + AI Lens Aperture + Bookmark -->
  <g transform="translate(256, 260)" filter="url(#bookShadow)">
    
    <!-- Left Page -->
    <path d="M -8 -85 C -75 -105 -150 -90 -170 -65 C -175 -60 -175 65 -175 75 C -150 55 -75 65 -8 85 Z" 
          fill="url(#leftPageGrad)" />
    <!-- Left Page Content Lines Mockup -->
    <line x1="-145" y1="-30" x2="-45" y2="-20" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" opacity="0.75" />
    <line x1="-145" y1="-2" x2="-55" y2="8" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" opacity="0.75" />
    <line x1="-145" y1="26" x2="-75" y2="34" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" opacity="0.75" />
    
    <!-- Right Page -->
    <path d="M 8 -85 C 75 -105 150 -90 170 -65 C 175 -60 175 65 175 75 C 150 55 75 65 8 85 Z" 
          fill="url(#rightPageGrad)" />
    <!-- Right Page Cover Art Mockup Card -->
    <rect x="35" y="-45" width="105" height="75" rx="12" fill="#38bdf8" opacity="0.85" />
    <circle cx="87" cy="-7" r="16" fill="#ffffff" opacity="0.9" />
    <line x1="38" y1="46" x2="135" y2="46" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" opacity="0.75" />

    <!-- Book Center Spine Seam -->
    <line x1="0" y1="-84" x2="0" y2="86" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

    <!-- Golden Hanging Bookmark Ribbon -->
    <path d="M -16 -88 L 16 -88 L 16 15 L 0 0 L -16 15 Z" fill="url(#bookmarkGrad)" filter="url(#softShadow)" />
    <circle cx="0" cy="-60" r="5" fill="#ffffff" opacity="0.8" />

    <!-- Smart AI Vision Optical Scan Brackets (Gleaming Bright Gold & Cyan) -->
    <!-- Top-Left Bracket -->
    <path d="M -175 -115 L -140 -115 M -175 -115 L -175 -80" stroke="#fde047" stroke-width="9" stroke-linecap="round" />
    <!-- Top-Right Bracket -->
    <path d="M 175 -115 L 140 -115 M 175 -115 L 175 -80" stroke="#fde047" stroke-width="9" stroke-linecap="round" />
    <!-- Bottom-Left Bracket -->
    <path d="M -175 105 L -140 105 M -175 105 L -175 70" stroke="#67e8f9" stroke-width="9" stroke-linecap="round" />
    <!-- Bottom-Right Bracket -->
    <path d="M 175 105 L 140 105 M 175 105 L 175 70" stroke="#67e8f9" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Joyful Sparkle Star (Top Right) -->
  <g transform="translate(390, 115)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#fde047" filter="url(#softShadow)" />
  </g>
  <!-- Mini Joyful Sparkle (Left) -->
  <g transform="translate(110, 140)">
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#a5f3fc" />
  </g>
</svg>
